<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="groundtruth — a Stop hook for Claude Code">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Octagon (stop sign shape) -->
  <polygon
    points="72,8 168,8 232,72 232,168 168,232 72,232 8,168 8,72"
    fill="url(#g)"
    filter="url(#s)"/>

  <!-- Inner octagon outline -->
  <polygon
    points="80,24 160,24 216,80 216,160 160,216 80,216 24,160 24,80"
    fill="none"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="2"/>

  <!-- Big check + line composite. The check = "verified". The line through it = "without evidence: blocked." -->
  <!-- Check mark -->
  <path
    d="M 70 124 L 108 162 L 178 88"
    fill="none"
    stroke="#fff"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Subtle wordmark below if rendered larger; hidden at icon size -->
</svg>

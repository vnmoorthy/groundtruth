name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      # SHA-pinned per /cso security review (v0.1.10). Floating tags are mutable;
      # SHAs are not. Dependabot bumps these in .github/dependabot.yml.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: node --check src/*.mjs bin/*.mjs test/*.mjs
      - name: test
        # `node --test` with no path arg walks the cwd and auto-discovers
        # *.test.{js,mjs,cjs} files. This is the only form portable across
        # Node 18, 20, and 22. The quoted-glob form (`'test/*.test.mjs'`)
        # is Node 22+ only; the directory form (`test/`) treats it as a
        # single file path.
        run: node --test
      - name: install flow (local mode)
        run: |
          export HOME=$(mktemp -d)
          bash install.sh
          "$HOME/.local/bin/groundtruth" version
          "$HOME/.local/bin/groundtruth" status
      - name: audit self (should find zero unverified claims in repo fixtures)
        run: node bin/groundtruth.mjs audit test/fixtures --fail-on 100

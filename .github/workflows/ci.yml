name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: node --check src/*.mjs bin/*.mjs test/*.mjs
      - name: test
        run: node --test 'test/*.test.mjs'
      - name: install flow (local mode)
        run: |
          export HOME=$(mktemp -d)
          bash install.sh
          "$HOME/.local/bin/groundtruth" version
          "$HOME/.local/bin/groundtruth" status
      - name: audit self (should find zero unverified claims in repo fixtures)
        run: node bin/groundtruth.mjs audit test/fixtures --fail-on 100
